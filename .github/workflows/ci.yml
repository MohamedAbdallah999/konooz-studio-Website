name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: konooz
          POSTGRES_PASSWORD: konooz
          POSTGRES_DB: konooz_pack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U konooz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://konooz:konooz@localhost:5432/konooz_pack_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
      FRONTEND_ORIGIN: http://localhost:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run db:migrate -w backend
      - run: npm run typecheck
      - run: npm test -w backend
        env:
          RUN_DB_TESTS: "1"
      - run: npm test -w frontend
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e -w frontend
